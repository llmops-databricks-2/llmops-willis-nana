# Project configuration for the LLMOps course, filled in for you at onboarding.
# Resources are provisioned at onboarding except the volume, which you create during the course.
# embedding_endpoint is the serving endpoint for ai_query, AI Search and DatabricksServingEndpoint;
# embedding_service is the AI Gateway model service for the OpenAI client (README.md).

# Development environment
dev:
  catalog: llmops_dev
  schema: willis_nana
  volume: sales_calls # should be tested
  llm_endpoint: course_ops.gateway.chat
  embedding_endpoint: course_ops.gateway.embed
  warehouse_id: af659090ca671c00
  experiment_path: /Shared/arxiv-curator-course
  lakebase_project_id: lb-llmops-willis-nana
  lakebase_database: lb-llmops-willis-nana
  genie_space_id: "01f1e608dce2166c9ecad01530fcf893" # Sales Calls Analytics

# Acceptance/Staging environment
acc:
  catalog: llmops_acc
  schema: willis_nana
  volume: sales_calls # to be tested
  llm_endpoint: course_ops.gateway.chat
  embedding_endpoint: course_ops.gateway.embed
  warehouse_id: fed166457cfccb89
  experiment_path: /Shared/arxiv-curator-course
  lakebase_project_id: lb-llmops-acc

# Production environment
prd:
  catalog: llmops_prd
  schema: willis_nana
  volume: sales_calls # to be tested
  llm_endpoint: course_ops.gateway.chat
  embedding_endpoint: course_ops.gateway.embed
  warehouse_id: fed166457cfccb89
  experiment_path: /Shared/arxiv-curator-course
  lakebase_project_id: lb-llmops-prd

# Model configuration
model_config:
  temperature: 0.7
  max_tokens: 2000
  top_p: 0.95

# Vector search configuration
vector_search:
  embedding_dimension: 1024
  similarity_metric: cosine
  num_results: 5

# Chunking configuration
chunking:
  chunk_size: 512
  chunk_overlap: 50
  separator: "\n\n"
